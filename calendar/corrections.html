<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="J-POP 내한 공연 일정의 오류, 변경과 취소 정보를 제보하는 페이지입니다.">
  <title>정보 수정 요청 | 제이라이브 코리아</title>
  <link rel="icon" type="image/png" href="./assets/brand/j-live-app-logo.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./site-config.js?v=20260729ga"></script><script src="./analytics.js"></script><script src="./site.js" defer></script>
</head>
<body>
  <div class="shell info-shell">
    <header><a class="brand" href="./"><span class="brand-mark">J</span> 제이라이브 코리아</a><a class="ghost-button" href="./">공연 달력</a></header>
    <main class="info-page">
      <div class="section-kicker">CORRECTION REQUEST</div>
      <h1>정보 수정 요청</h1>
      <p class="info-lead">공연 일정 변경, 취소, 예매처 변경 또는 잘못된 정보를 발견했다면 공식 출처와 함께 알려주세요.</p>
      <p class="form-success" id="sent" role="status">수정 요청이 접수되었습니다. 공식 출처를 확인한 뒤 반영하겠습니다.</p>
      <form class="correction-form" action="https://formsubmit.co/2b17f101d256e5e8482c76f35ebe3aef" method="POST" data-track-submit="correction_submit">
        <input type="hidden" name="_subject" value="J-LIVE 정보 수정 요청">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://j-live.kr/calendar/corrections#sent">
        <label>아티스트 또는 공연명<input name="artist" id="correctionArtist" required></label>
        <label>수정할 내용<textarea name="message" rows="6" required placeholder="현재 표시된 내용과 올바른 내용을 적어주세요."></textarea></label>
        <label>공식 출처 URL<input name="source" type="url" required placeholder="https://"></label>
        <label>답변 받을 이메일<input name="email" type="email" autocomplete="email" maxlength="120" required></label>
        <label class="form-consent"><input type="checkbox" name="privacy_consent" value="동의함" required> 요청 처리와 답변을 위한 개인정보 수집 및 외부 전송에 동의합니다.</label>
        <input class="form-honey" type="text" name="_honey" tabindex="-1" autocomplete="off">
        <button class="primary-submit" type="submit">수정 요청 보내기</button>
        <p class="form-help">입력한 정보는 요청 확인과 답변에만 사용됩니다.</p>
      </form>
    </main>
    <footer class="site-footer"><nav><a href="./about">소개</a><a href="./contact">문의</a><a href="./privacy">개인정보처리방침</a><a href="./terms">이용약관</a></nav></footer>
  </div>
</body>
</html>
