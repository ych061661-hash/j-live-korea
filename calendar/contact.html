<!doctype html>
<html lang="ko">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3081918168688274" crossorigin="anonymous"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="제이라이브 코리아 운영 문의와 제휴 연락처입니다.">
  <title>문의 | 제이라이브 코리아</title>
  <link rel="icon" type="image/png" href="./assets/brand/j-live-app-logo.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./site-config.js?v=20260729ga"></script><script src="./analytics.js"></script><script src="./site.js" defer></script>
</head>
<body>
  <div class="shell info-shell">
    <header><a class="brand" href="./"><span class="brand-mark">J</span> 제이라이브 코리아</a><a class="ghost-button" href="./">공연 달력</a></header>
    <main class="info-page">
      <div class="section-kicker">CONTACT</div>
      <h1>문의하기</h1>
      <p class="info-lead">공연 정보 제보, 서비스 문의, 광고와 제휴 제안을 받고 있습니다.</p>
      <p class="form-success" id="sent" role="status">문의가 접수되었습니다. 확인 후 입력하신 이메일로 답변드리겠습니다.</p>
      <form class="contact-form" action="https://formsubmit.co/2b17f101d256e5e8482c76f35ebe3aef" method="POST" data-track-submit="form_submit">
        <input type="hidden" name="_subject" value="J-LIVE 새 문의">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://j-live.kr/calendar/contact#sent">
        <label>이름 또는 닉네임<input name="name" autocomplete="name" maxlength="50" required></label>
        <label>답변 받을 이메일<input name="email" type="email" autocomplete="email" maxlength="120" required></label>
        <label>문의 유형<select name="category" required><option value="">선택해 주세요</option><option>공연 정보 제보</option><option>서비스 문의</option><option>광고·제휴</option><option>기타</option></select></label>
        <label>문의 내용<textarea name="message" rows="7" maxlength="3000" required placeholder="공연 정보 제보 시 아티스트명, 공연일, 공식 출처 URL을 함께 적어주세요."></textarea></label>
        <label class="form-consent"><input type="checkbox" required> 문의 처리와 답변을 위한 개인정보 수집 및 외부 전송에 동의합니다.</label>
        <input class="form-honey" type="text" name="_honey" tabindex="-1" autocomplete="off">
        <button class="primary-submit" type="submit">문의 보내기</button>
        <p class="form-help">입력한 정보는 문의 처리에만 사용됩니다. 자세한 내용은 <a href="./privacy">개인정보처리방침</a>에서 확인할 수 있습니다.</p>
      </form>
      <section><h2>예매 관련 문의</h2><p>결제, 취소, 좌석과 티켓 배송 문제는 제이라이브 코리아에서 처리할 수 없습니다. 해당 공연의 공식 예매처 고객센터로 문의하세요.</p></section>
    </main>
    <footer class="site-footer"><nav><a href="./about">소개</a><a href="./privacy">개인정보처리방침</a><a href="./terms">이용약관</a><a href="./corrections">정보 수정 요청</a></nav></footer>
  </div>
</body>
</html>
